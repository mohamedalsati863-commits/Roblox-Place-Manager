<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد أسماء روبلوكس الثلاثية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🎲 توليد اليوزرات الثلاثية (سجل مباشر)</h1>
        <p>اضغط ابدأ لبدء توليد القائمة، واضغط إيقاف عند الرغبة:</p>

        <div class="controls">
            <button id="startBtn" onclick="startGenerating()" class="btn btn-start">Start (ابدأ)</button>
            <button id="stopBtn" onclick="stopGenerating()" class="btn btn-stop" disabled>Stop (إيقاف)</button>
        </div>

        <!-- صندوق القائمة المتجددة -->
        <div class="list-box" id="listBox">
            <div class="placeholder">اضغط ابدأ للبدء...</div>
        </div>
    </div>

    <script>
        let timer = null;

        function generateSingle() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789_';
            let result = '';
            
            for (let i = 0; i < 3; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            const listBox = document.getElementById('listBox');
            
            // إزالة النص الأولي عند أول توليد
            const placeholder = listBox.querySelector('.placeholder');
            if (placeholder) {
                placeholder.remove();
            }

            // إنشاء عنصر جديد يضاف في أسفل القائمة
            const item = document.createElement('div');
            item.className = 'user-item';
            item.innerHTML = `
                <span class="username-text">${result}</span>
                <a href="https://www.roblox.com/search/users?keyword=${result}" target="_blank" class="check-link">
                    🔍 تحقق
                </a>
            `;

            listBox.appendChild(item);

            // التمرير التلقائي للأسفل لرؤية أحدث اسم
            listBox.scrollTop = listBox.scrollHeight;
        }

        function startGenerating() {
            // توليد اسم جديد كل 300 مللي ثانية
            timer = setInterval(generateSingle, 300);

            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
        }

        function stopGenerating() {
            clearInterval(timer);

            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }
    </script>

</body>
</html>
