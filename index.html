<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coding - Advanced Assistant</title>
    <!-- Highlight.js for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --bg-chat: #21262d;
            --accent: #238636;
            --accent-hover: #2ea043;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border: #30363d;
            --user-msg: #1f6feb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Control */
        .sidebar {
            width: 300px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar h2 {
            font-size: 18px;
            color: #58a6ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: bold;
        }

        input, select {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #58a6ff;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            padding: 15px 20px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            line-height: 1.6;
            font-size: 14px;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: #fff;
            padding: 12px 16px;
            border-radius: 12px 12px 0 12px;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 12px 12px 12px 0;
            width: 90%;
        }

        /* Code Blocks Formatting */
        pre {
            position: relative;
            margin: 10px 0;
            border-radius: 6px;
            overflow: hidden;
            direction: ltr;
            text-align: left;
        }

        code {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
        }

        .copy-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Input Control */
        .input-area {
            padding: 15px 20px;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 6px;
            resize: none;
            height: 50px;
            font-size: 14px;
            outline: none;
        }

        textarea:focus {
            border-color: #58a6ff;
        }

        button.send-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.send-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <!-- Sidebar Control -->
    <div class="sidebar">
        <h2>⚡ AI Coding Controls</h2>
        
        <div class="form-group">
            <label for="apiKey">DeepSeek API Key:</label>
            <!-- sk-7ee8ab7ff8dc4fe19997c686ad795cfe -->
            <input type="password" id="apiKey" placeholder="sk-..." onchange="saveApiKey()">
        </div>

        <div class="form-group">
            <label for="targetLang">Target Programming Language:</label>
            <select id="targetLang">
                <option value="Auto">Auto Detect</option>
                <option value="Python">Python</option>
                <option value="Lua / Roblox">Lua (Roblox)</option>
                <option value="JavaScript / TS">JavaScript / TypeScript</option>
                <option value="C++">C++</option>
                <option value="C# / Unity">C# (Unity)</option>
                <option value="HTML/CSS">HTML / CSS</option>
            </select>
        </div>

        <div class="form-group">
            <label for="aiMode">Mode:</label>
            <select id="aiMode">
                <option value="code">💻 Full Senior Coding & Debugging</option>
                <option value="explain">🔍 Code Explanation & Review</option>
                <option value="general">💬 General Programming Advice</option>
            </select>
        </div>
    </div>

    <!-- Main Window -->
    <div class="main-content">
        <div class="chat-header">
            <h3>🤖 AI Coding Assistant (DeepSeek Powered)</h3>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                Welcome to <b>AI Coding</b>! I am your senior software development assistant powered by DeepSeek. Ask me any programming questions or general queries.
            </div>
        </div>

        <div class="input-area">
            <textarea id="userInput" placeholder="Ask anything or paste your code here..." onkeydown="handleKeyDown(event)"></textarea>
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('deepseek_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            localStorage.setItem('deepseek_api_key', key);
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const apiKey = localStorage.getItem('deepseek_api_key') || document.getElementById('apiKey').value.trim();
            const inputField = document.getElementById('userInput');
            const userText = inputField.value.trim();
            const lang = document.getElementById('targetLang').value;
            const mode = document.getElementById('aiMode').value;

            if (!apiKey) {
                alert('Please enter your DeepSeek API Key in the sidebar first!');
                return;
            }

            if (!userText) return;

            appendMessage(userText, 'user');
            inputField.value = '';

            const loadingId = appendMessage('⏳ Thinking...', 'assistant');

            const systemPrompt = `You are "AI Coding", an elite Senior Software Engineer powered by DeepSeek.
You excel at writing high-performance, clean, and bug-free code across all languages (Python, Lua, JavaScript, C++, C#, etc.).
Context Language: ${lang}.
Mode: ${mode}.

Guidelines:
1. For coding requests: Output properly formatted code blocks. Ensure syntax is correct and well-commented.
2. For non-coding requests: Answer directly and accurately without forcing coding syntax.
3. Keep answers concise, highly technical, and production-ready.`;

            try {
                // Connecting to DeepSeek API Endpoint
                const response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userText }
                        ],
                        temperature: 0.3
                    })
                });

                const data = await response.json();
                const loadingElem = document.getElementById(loadingId);

                if (response.ok) {
                    const aiReply = data.choices[0].message.content;
                    loadingElem.innerHTML = formatMarkdown(aiReply);
                    hljs.highlightAll();
                } else {
                    loadingElem.innerText = `❌ API Error: ${data.error ? data.error.message : 'Check your API Key'}`;
                }
            } catch (err) {
                document.getElementById(loadingId).innerText = `❌ Connection Error: ${err.message}`;
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            const msgId = 'msg-' + Date.now();
            msgDiv.id = msgId;
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return msgId;
        }

        function formatMarkdown(text) {
            let html = text.replace(/```(\w+)?\n([\s\S]*?)```/g, function(match, lang, code) {
                const language = lang || 'plaintext';
                return `<pre><button class="copy-btn" onclick="copyCode(this)">Copy Code</button><code class="language-${language}">${escapeHtml(code.trim())}</code></pre>`;
            });
            return html.replace(/\n/g, '<br>');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function copyCode(btn) {
            const code = btn.nextElementSibling.innerText;
            navigator.clipboard.writeText(code).then(() => {
                btn.innerText = 'Copied! ✓';
                setTimeout(() => btn.innerText = 'Copy Code', 2000);
            });
        }
    </script>
</body>
</html>
