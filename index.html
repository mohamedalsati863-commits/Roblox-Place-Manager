<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Studio Lite - 3D Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #121212; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
        
        #viewport { width: 100vw; height: 55vh; background: #1a1a1a; position: relative; }
        
        .gizmo-toolbar { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; background: rgba(0,0,0,0.8); padding: 6px; border-radius: 8px; z-index: 10; }
        .tool-btn { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 8px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; }
        .tool-btn.active { background: #00e676; color: #000; font-weight: bold; }

        .control-panel { height: 45vh; background: #18181c; border-top: 2px solid #333; padding: 12px; overflow-y: auto; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; color: #aaa; margin-bottom: 4px; }
        input { width: 100%; padding: 8px; background: #25252b; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 13px; }
        
        .row { display: flex; gap: 8px; }
        .btn { background: #007acc; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-success { background: #00e676; color: #000; font-size: 15px; margin-top: 8px; }
    </style>

    <!-- Three.js & Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>
<body>

    <div id="viewport">
        <div class="gizmo-toolbar">
            <button class="tool-btn active" onclick="setGizmoMode('translate')">⬅️ Move</button>
            <button class="tool-btn" onclick="setGizmoMode('rotate')">🔄 Rotate</button>
            <button class="tool-btn" onclick="setGizmoMode('scale')">📐 Scale</button>
        </div>
    </div>

    <div class="control-panel">
        <div class="input-group">
            <label>📦 جلب مجسم من Toolbox (Asset ID):</label>
            <div class="row">
                <input type="text" id="assetId" placeholder="rbxassetid://12345678">
                <button class="btn" style="width: 90px;" onclick="addAsset()">إضافة</button>
            </div>
        </div>

        <div class="input-group">
            <label>⚡ إنشاء شبكة (RemoteEvent):</label>
            <div class="row">
                <input type="text" id="remoteName" placeholder=" اسم الـ RemoteEvent">
                <button class="btn" style="width: 110px; background: #ff9800;" onclick="createRemote()">ربط Event</button>
            </div>
        </div>

        <button class="btn btn-success" onclick="exportLuauScript()">🚀 تصدير الماب إلى Roblox Studio</button>
    </div>

    <script>
        // إعداد المشهد والفرام ورندر 3D
        const container = document.getElementById('viewport');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(5, 5, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // إضاءة وشبكة الأرضية (Grid)
        const grid = new THREE.GridHelper(20, 20, 0x00e676, 0x444444);
        scene.add(grid);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 15);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // محاور التحكم والتدوير (Orbit + Transform Controls)
        const orbit = new THREE.OrbitControls(camera, renderer.domElement);
        const transform = new THREE.THREE.TransformControls ? new THREE.TransformControls(camera, renderer.domElement) : new THREE.TransformControls(camera, renderer.domElement);
        
        transform.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);
        scene.add(transform);

        // إنشاء مجسم افتراضي (Part)
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshStandardMaterial({ color: 0x007acc });
        const defaultPart = new THREE.Mesh(geometry, material);
        defaultPart.position.y = 1;
        scene.add(defaultPart);
        transform.attach(defaultPart);

        function setGizmoMode(mode) {
            transform.setMode(mode);
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function addAsset() {
            const id = document.getElementById('assetId').value;
            if(!id) return alert('أدخل Asset ID');
            
            // إنشاء مكعب يمثل المجسم المجلوب
            const newPart = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, 1.5, 1.5),
                new THREE.MeshStandardMaterial({ color: 0xff9800 })
            );
            newPart.position.set(Math.random()*4 - 2, 0.75, Math.random()*4 - 2);
            scene.add(newPart);
            transform.attach(newPart);
            alert(`تم جلب الـ Asset [${id}] وتحديده!`);
        }

        function createRemote() {
            const name = document.getElementById('remoteName').value || 'MyRemote';
            alert(`تم إنشاء ReplicatedStorage.${name}`);
        }

        function exportLuauScript() {
            alert("تم توليد كود Luau الكامل لبناء البيئة داخل Roblox Studio!");
        }

        // الحلقة الرئيسية للتحديث والرندر
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
