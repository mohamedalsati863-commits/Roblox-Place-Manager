<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة مابات روبلوكس</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00a2ff;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --success-color: #28a745;
            --error-color: #dc3545;
            --info-bg: #2b3846;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
        }

        .info-box {
            background-color: var(--info-bg);
            border-right: 4px solid var(--accent-color);
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            color: var(--text-muted);
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        .status-message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
        .status-message.success { background-color: rgba(40, 167, 69, 0.2); border: 1px solid var(--success-color); color: var(--success-color); display: block; }
        .status-message.error { background-color: rgba(220, 53, 69, 0.2); border: 1px solid var(--error-color); color: var(--error-color); display: block; }
    </style>
</head>
<body>

    <h1>لوحة إدارة مابات روبلوكس</h1>

    <div class="container">
        <!-- قسم الأمان والصلاحيات -->
        <div class="card">
            <h2>🔒 أمان اللوحة والصلاحيات</h2>
            <div class="info-box">
                <strong>تنبيه أمان:</strong> هذه اللوحة لا تطلب كلمة سر حسابك ولا تملك صلاحيات تهكير.
                عند إنشاء الـ API Key من روبلوكس، حدد الصلاحيات التالية فقط:
                <ul>
                    <li><b>Experience Place:</b> Write</li>
                    <li><b>Experience Details:</b> Write</li>
                </ul>
            </div>
            <div class="form-group">
                <label for="apiKey">مفتاح الـ API Key:</label>
                <input type="password" id="apiKey" placeholder="أدخل Roblox Open Cloud API Key">
            </div>
            <div class="form-group">
                <label for="universeId">رقم الماب الرئيسي (Universe ID):</label>
                <input type="text" id="universeId" placeholder="مثال: 1234567890">
            </div>
            <button onclick="saveConfig()">حفظ إعدادات الاتصال</button>
            <div id="configStatus" class="status-message"></div>
        </div>

        <!-- قسم تعديل الماب -->
        <div class="card">
            <h2>تعديل معلومات الماب</h2>
            <div class="form-group">
                <label for="placeName">اسم الماب الجديد:</label>
                <input type="text" id="placeName" placeholder="أدخل اسم الماب">
            </div>
            <div class="form-group">
                <label for="placeDescription">الوصف الجديد:</label>
                <textarea id="placeDescription" rows="3" placeholder="أدخل وصف الماب"></textarea>
            </div>
            <button onclick="updatePlaceInfo()">حفظ التغييرات</button>
            <div id="updateStatus" class="status-message"></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            if (localStorage.getItem('roblox_api_key')) document.getElementById('apiKey').value = localStorage.getItem('roblox_api_key');
            if (localStorage.getItem('roblox_universe_id')) document.getElementById('universeId').value = localStorage.getItem('roblox_universe_id');
        };

        function saveConfig() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const universeId = document.getElementById('universeId').value.trim();
            const statusDiv = document.getElementById('configStatus');

            if (!apiKey || !universeId) {
                showStatus(statusDiv, 'يرجى إدخال البيانات كاملة.', false);
                return;
            }

            localStorage.setItem('roblox_api_key', apiKey);
            localStorage.setItem('roblox_universe_id', universeId);
            showStatus(statusDiv, 'تم حفظ البيانات بنجاح في متصفحك!', true);
        }

        function showStatus(element, message, isSuccess) {
            element.innerText = message;
            element.className = 'status-message ' + (isSuccess ? 'success' : 'error');
        }
    </script>
</body>
</html>
