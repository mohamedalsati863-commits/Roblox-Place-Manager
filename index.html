<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Place Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: #fff; text-align: center; padding: 20px; }
        .card { background: #2a2a2a; border-radius: 8px; padding: 20px; max-width: 400px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, button { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        input { background: #333; color: #fff; }
        button { background: #00a2ff; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #0088cc; }
    </style>
</head>
<body>

    <h1>لوحة إدارة مابات روبلوكس</h1>

    <div class="card">
        <h3>تعديل معلومات الماب</h3>
        <input type="text" placeholder="اسم الماب الجديد">
        <input type="text" placeholder="الوصف الجديد">
        <button>حفظ التغييرات</button>
    </div>

    <div class="card">
        <h3>إنشاء Place جديد</h3>
        <input type="text" placeholder="اسم الـ Place الجديد">
        <button>إنشاء الآن</button>
    </div>

</body>
</html>
