<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد أسماء روبلوكس الثلاثية والرباعية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🎲 توليد يوزرات ثلاثية ورباعية عشوائية</h1>
        <p>اضغط ابدأ لبدء توليد القائمة، واضغط إيقاف عند الرغبة:</p>

        <div class="controls">
            <button id="startBtn" onclick="startGenerating()" class="btn btn-start">Start (ابدأ)</button>
            <button id="stopBtn" onclick="stopGenerating()" class="btn btn-stop" disabled>Stop (إيقاف)</button>
        </div>

        <!-- صندوق القائمة المتجددة -->
        <div class="list-box" id="listBox">
            <div class="placeholder">اضغط ابدأ للبدء...</div>
        </div>
    </div>

    <script>
        let timer = null;

        function copyUsername(text, buttonEl) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = buttonEl.innerText;
                buttonEl.innerText = 'تم النسخ! ✓';
                buttonEl.classList.add('copied');
                
                setTimeout(() => {
                    buttonEl.innerText = originalText;
                    buttonEl.classList.remove('copied');
                }, 1200);
            });
        }

        function generateSingle() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789_';
            let result = '';
            
            // اختيار طول الاسم عشوائياً (إما 3 أو 4 خانات)
            const length = Math.random() < 0.5 ? 3 : 4;
            
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            const listBox = document.getElementById('listBox');
            
            // إزالة النص الأولي عند أول توليد
            const placeholder = listBox.querySelector('.placeholder');
            if (placeholder) {
                placeholder.remove();
            }

            // إنشاء عنصر جديد يحتوي على اليوزر وزر النسخ
            const item = document.createElement('div');
            item.className = 'user-item';
            item.innerHTML = `
                <span class="username-text">${result}</span>
                <button class="btn-copy" onclick="copyUsername('${result}', this)">📋 نسخ</button>
            `;

            listBox.appendChild(item);

            // التمرير التلقائي للأسفل
            listBox.scrollTop = listBox.scrollHeight;
        }

        function startGenerating() {
            timer = setInterval(generateSingle, 300);

            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
        }

        function stopGenerating() {
            clearInterval(timer);

            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }
    </script>

</body>
</html>
