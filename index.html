<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة مابات روبلوكس</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00a2ff;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --success-color: #28a745;
            --error-color: #dc3545;
            --info-bg: #2b3846;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin: 0;
        }

        .logout-btn {
            background-color: #dc3545;
            padding: 8px 15px;
            font-size: 13px;
            width: auto;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 18px;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .info-box {
            background-color: var(--info-bg);
            border-right: 4px solid var(--accent-color);
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            color: var(--text-muted);
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .status-message {
            margin-top: 10px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
            line-height: 1.6;
        }

        .status-message.success {
            background-color: rgba(40, 167, 69, 0.2);
            border: 1px solid var(--success-color);
            color: var(--success-color);
            display: block;
        }

        .status-message.error {
            background-color: rgba(220, 53, 69, 0.2);
            border: 1px solid var(--error-color);
            color: var(--error-color);
            display: block;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول / الاتصال -->
    <div id="loginScreen" class="container" style="margin-top: 40px;">
        <div class="card">
            <h2>🔑 تسجيل الدخول للوحة الإدارة</h2>
            <div class="info-box">
                <strong>🔒 أمان حسابك مضمون:</strong><br>
                الموقع لا يطلب كلمة سر روبلوكس ولا يملك أي إمكانية للوصول لحسابك.
            </div>
            <div class="form-group">
                <label for="apiKey">مفتاح الـ API Key الخاص بك:</label>
                <input type="password" id="apiKey" placeholder="أدخل Roblox Open Cloud API Key">
            </div>
            <div class="form-group">
                <label for="universeId">رقم الماب الرئيسي (Universe ID):</label>
                <input type="text" id="universeId" placeholder="مثال: 1234567890">
            </div>
            <button id="loginBtn" onclick="login()">التحقق والدخول للوحة التحكم</button>
            <div id="loginStatus" class="status-message"></div>
        </div>
    </div>

    <!-- شاشة لوحة التحكم Dashboard (تظهر بعد نجاح التحقق) -->
    <div id="dashboardScreen" class="container hidden">
        <div class="header">
            <h1>📊 لوحة تحكم Roblox Place Manager</h1>
            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>

        <!-- قسم إنشاء Place جديد -->
        <div class="card">
            <h2>➕ إنشاء Place جديد داخل الماب</h2>
            <div class="form-group">
                <label for="newPlaceName">اسم الـ Place الجديد:</label>
                <input type="text" id="newPlaceName" placeholder="مثال: Stage 2 / Lobby">
            </div>
            <div class="form-group">
                <label for="newPlaceDescription">الوصف (اختياري):</label>
                <textarea id="newPlaceDescription" rows="2" placeholder="أدخل وصف الـ Place الجديد"></textarea>
            </div>
            <button onclick="createNewPlace()">إنشاء Place الآن</button>
            <div id="createStatus" class="status-message"></div>
        </div>

        <!-- قسم تعديل معلومات الماب -->
        <div class="card">
            <h2>✏️ تعديل معلومات الماب الرئيسي</h2>
            <div class="form-group">
                <label for="placeName">اسم الماب الجديد:</label>
                <input type="text" id="placeName" placeholder="أدخل اسم الماب الجديد">
            </div>
            <div class="form-group">
                <label for="placeDescription">الوصف الجديد:</label>
                <textarea id="placeDescription" rows="3" placeholder="أدخل وصف الماب الجديد"></textarea>
            </div>
            <button onclick="updatePlaceInfo()">حفظ التغييرات</button>
            <div id="updateStatus" class="status-message"></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('roblox_api_key');
            const savedUniverse = localStorage.getItem('roblox_universe_id');

            if (savedKey && savedUniverse) {
                showDashboard();
            }
        };

        async function login() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const universeId = document.getElementById('universeId').value.trim();
            const statusDiv = document.getElementById('loginStatus');

            if (!apiKey || !universeId) {
                showStatus(statusDiv, '❌ يرجى إدخال الـ API Key و Universe ID لتسجيل الدخول.', false);
                return;
            }

            showStatus(statusDiv, '⏳ جاري التحقق من المفتاح والصلاحيات مع Roblox...', true);

            try {
                // محاولة الاتصال بـ Roblox لتفحص الـ API Key والحساب
                const response = await fetch(`https://apis.roblox.com/universes/v1/${universeId}`, {
                    method: 'GET',
                    headers: {
                        'x-api-key': apiKey
                    }
                });

                if (response.ok) {
                    // الاتصال ناجح والصلاحيات سليمة
                    localStorage.setItem('roblox_api_key', apiKey);
                    localStorage.setItem('roblox_universe_id', universeId);
                    
                    showStatus(statusDiv, '✅ تم الاتصال بنجاح! جاري التوجيه...', true);
                    setTimeout(() => {
                        showDashboard();
                    }, 800);

                } else if (response.status === 401) {
                    // المفتاح خطأ تماماً
                    showStatus(statusDiv, '❌ مفتاح الـ API Key غير صحيح أو غير مفعل!', false);

                } else if (response.status === 403) {
                    // المفتاح صح لكن الصلاحيات مفقودة
                    showStatus(statusDiv, 
                        `⚠️ لا يوجد الصلاحيات الصحيحة لهذا الماب!<br><br>` +
                        `<b>الصلاحيات المطلوبة في Roblox Open Cloud:</b><br>` +
                        `• <code>universe-place:write</code> (أو Experience Place - Write)<br>` +
                        `• <code>universe:write</code> (أو Experience Details - Write)`, false);

                } else if (response.status === 404) {
                    // رقم الماب خطأ
                    showStatus(statusDiv, '❌ رقم الماب الرئيسي (Universe ID) غير موجود!', false);

                } else {
                    const errData = await response.json().catch(() => ({}));
                    showStatus(statusDiv, `❌ فشل الاتصال: ${errData.message || response.statusText}`, false);
                }

            } catch (error) {
                // التعامل مع خطأ الاتصال أو حظر CORS للمتصفح
                showStatus(statusDiv, `⚠️ لم نتمكن من الاتصال بـ Roblox مباشرة (قد يكون بسبب قيود CORS متصفحك).<br>تأكد من المفتاح ومجال IP المصرح له.`, false);
            }
        }

        function logout() {
            localStorage.removeItem('roblox_api_key');
            localStorage.removeItem('roblox_universe_id');
            document.getElementById('apiKey').value = '';
            document.getElementById('universeId').value = '';
            
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
        }

        async function createNewPlace() {
            const apiKey = localStorage.getItem('roblox_api_key');
            const universeId = localStorage.getItem('roblox_universe_id');
            const name = document.getElementById('newPlaceName').value.trim();
            const description = document.getElementById('newPlaceDescription').value.trim();
            const statusDiv = document.getElementById('createStatus');

            if (!name) {
                showStatus(statusDiv, '❌ يرجى كتابة اسم الـ Place الجديد.', false);
                return;
            }

            showStatus(statusDiv, '⏳ جاري إرسال الطلب لإنشاء Place جديد...', true);

            try {
                const response = await fetch(`https://apis.roblox.com/universes/v1/${universeId}/places`, {
                    method: 'POST',
                    headers: {
                        'x-api-key': apiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: name,
                        description: description
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    showStatus(statusDiv, `🎉 تم إنشاء الـ Place بنجاح! رقم الـ Place ID الجديد هو: ${data.placeId || JSON.stringify(data)}`, true);
                } else if (response.status === 403) {
                    showStatus(statusDiv, `⚠️ لا تملك صلاحية إنشاء Place! تحتاج صلاحية: <code>universe-place:write</code>`, false);
                } else {
                    const errData = await response.json().catch(() => ({}));
                    showStatus(statusDiv, `❌ فشل الإنشاء: ${errData.message || response.statusText}`, false);
                }
            } catch (error) {
                showStatus(statusDiv, `❌ حدث خطأ في الاتصال: ${error.message}`, false);
            }
        }

        async function updatePlaceInfo() {
            const apiKey = localStorage.getItem('roblox_api_key');
            const universeId = localStorage.getItem('roblox_universe_id');
            const name = document.getElementById('placeName').value.trim();
            const description = document.getElementById('placeDescription').value.trim();
            const statusDiv = document.getElementById('updateStatus');

            if (!name) {
                showStatus(statusDiv, '❌ يرجى كتابة اسم الماب الجديد.', false);
                return;
            }

            showStatus(statusDiv, '⏳ جاري تحديث البيانات في Roblox...', true);

            try {
                const response = await fetch(`https://apis.roblox.com/universes/v1/${universeId}`, {
                    method: 'PATCH',
                    headers: {
                        'x-api-key': apiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        description: description
                    })
                });

                if (response.ok) {
                    showStatus(statusDiv, '✅ تم تحديث معلومات الماب بنجاح!', true);
                } else if (response.status === 403) {
                    showStatus(statusDiv, `⚠️ لا تملك صلاحية التعديل! تحتاج صلاحية: <code>universe:write</code>`, false);
                } else {
                    const errData = await response.json().catch(() => ({}));
                    showStatus(statusDiv, `❌ فشل التحديث: ${errData.message || response.statusText}`, false);
                }
            } catch (error) {
                showStatus(statusDiv, `❌ حدث خطأ في الاتصال: ${error.message}`, false);
            }
        }

        function showStatus(element, message, isSuccess) {
            element.innerHTML = message;
            element.className = 'status-message ' + (isSuccess ? 'success' : 'error');
        }
    </script>
</body>
</html>
